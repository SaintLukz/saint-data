<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saint Data</title>
<meta name="description" content="Saint Data: os jogos do Roblox em números. Jogadores, tendências, estúdios e gêneros, atualizados todo dia.">
<meta name="theme-color" content="#0c0f1a">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem("sd-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/" aria-label="Saint Data, início">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="7" rx="9" ry="3.2" fill="none" stroke="var(--accent)" stroke-width="2.2"/><rect x="6" y="20" width="4.5" height="8" rx="1.2" fill="currentColor"/><rect x="13.75" y="14" width="4.5" height="14" rx="1.2" fill="currentColor"/><rect x="21.5" y="17" width="4.5" height="11" rx="1.2" fill="currentColor"/></svg>
      <span>Saint Data</span>
    </a>
    <nav class="nav" aria-label="Seções">
      <a href="#/" data-route="home">Início</a>
      <a href="#/jogos" data-route="jogos">Jogos</a>
      <a href="#/estudios" data-route="estudios">Estúdios</a>
      <a href="#/generos" data-route="generos">Gêneros</a>
      <a href="#/novos" data-route="novos">Novos</a>
    </nav>
    <div class="side-foot">
      <button class="theme-btn" id="theme-btn" type="button">Alternar tema</button>
      <p class="stamp" id="stamp">Carregando dados…</p>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1">
    <p class="loading">Carregando dados…</p>
  </main>
</div>
<script src="assets/app.js" type="module"></script>
</body>
</html>
