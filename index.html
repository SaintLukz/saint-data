<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saint Data · Jogadores ao vivo de todos os jogos do Roblox</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem("sd-theme");if(t&&t!=="system")document.documentElement.dataset.theme=t;if(localStorage.getItem("sd-collapsed")==="true")document.documentElement.classList.add("side-collapsed")}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <a class="brand" href="#/" aria-label="Saint Data, início"><img src="assets/mark.svg" alt="" width="24" height="24"><span>Saint Data</span></a>
      <button class="icon-btn" id="collapse" type="button" aria-label="Recolher menu" title="Recolher menu"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M8 3.5v13"/></svg></button>
    </div>
    <button class="side-link" id="search-btn" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8" stroke-linecap="round"/></svg><span>Buscar</span><kbd>/</kbd></button>
    <nav class="side-nav" aria-label="Seções">
      <a class="side-link" href="#/" data-nav="terminal"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3.5"/><path d="m6 12 2.6-2.8 2.2 1.8L14 7.5" stroke-linecap="round"/></svg><span>Terminal</span></a>
      <a class="side-link" href="#/atividade" data-nav="atividade"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10h3l2-5 4 10 2-5h4"/></svg><span>Atividade</span></a>
      <a class="side-link" href="#/watchlist" data-nav="watchlist"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/></svg><span>Meus jogos</span></a>
      <a class="side-link" href="#/comparar" data-nav="comparar"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l4-5 3 3 6-8"/><path d="M3 12l4-2 3 1 6-4" opacity=".45"/></svg><span>Comparar</span></a>
    </nav>
    <div class="side-foot">
      <a class="side-card" href="#/sobre"><span class="mk"><img src="assets/mark.svg" alt="" width="22" height="22"></span><span><b>Sobre os dados</b><small id="side-stamp">Carregando…</small></span></a>
      <div class="foot-row">
        <div class="theme-wrap">
          <button class="round-btn" id="theme-btn" type="button" aria-label="Tema" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"/><path d="M10 2.8v1.6M10 15.6v1.6M2.8 10h1.6M15.6 10h1.6M4.9 4.9l1.1 1.1M14 14l1.1 1.1M4.9 15.1 6 14M14 6l1.1-1.1"/></svg></button>
          <div class="pop theme-pop" id="theme-pop" hidden>
            <button type="button" data-theme-pick="light"><span class="sw sw-light"></span>Claro</button>
            <button type="button" data-theme-pick="dark"><span class="sw sw-dark"></span>Escuro</button>
            <button type="button" data-theme-pick="system"><span class="sw sw-sys"></span>Sistema</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"><p class="loading">Carregando…</p></main>
</div>
<div class="search-layer" id="search-layer" hidden>
  <div class="search-box" role="dialog" aria-label="Buscar">
    <div class="search-in"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8" stroke-linecap="round"/></svg><input id="search-q" type="search" placeholder="Buscar jogos, estúdios e gêneros" autocomplete="off"></div>
    <div id="search-res" class="search-res"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="assets/app.js" type="module"></script>
</body>
</html>
